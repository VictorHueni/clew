# ─────────────────────────────────────────────
# Slide Builder - Project Configuration
# ─────────────────────────────────────────────

title: "The Agentic Development Stack"
author: "Victor Hueni"
date_label: "June 2026"

canvas:
  width: 1280
  height: 720

fonts:
  - family: "Inter"
    weights: [400, 500, 600, 700, 800]
  - family: "JetBrains Mono"
    weights: [400, 500]

external_scripts:
  - "https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"

slides:
  - file: "01-cover.html"
    class: "s-cover"
    label: "Cover"
  - file: "02-proof.html"
    class: "s-proof"
    label: "Proof — same model, better harness"
  - file: "03-lever.html"
    class: "s-lever"
    label: "The lever is the tooling"
  - file: "04-anatomy.html"
    class: "s-anatomy"
    label: "Anatomy — loop + 15 capabilities"
  - file: "04b-rings.html"
    class: "s-rings2"
    label: "Anatomy — harness around the model"
  - file: "05-memory.html"
    class: "s-memory"
    label: "Harnesses starve memory"
  - file: "05b-contextrot.html"
    class: "s-crot"
    label: "Context rot — the window isn't the memory"
  - file: "06-clew.html"
    class: "s-clew"
    label: "clew engineers memory"
  - file: "07-metamodel.html"
    class: "s-sdlc-ov"
    label: "SDLC overview — context to code"
  - file: "07b-sdlc-discover.html"
    class: "s-phase"
    label: "SDLC ① Discover & Define"
  - file: "07c-sdlc-design.html"
    class: "s-phase"
    label: "SDLC ② Design the Solution"
  - file: "07d-sdlc-deliver.html"
    class: "s-phase"
    label: "SDLC ③ Execute & Deliver"
  - file: "08-mechanism.html"
    class: "s-mechanism"
    label: "Deterministic IDs, write-time checks"
  - file: "09-traceability.html"
    class: "s-trace"
    label: "Trace, impact, integrity"
  - file: "10-close.html"
    class: "s-close"
    label: "Engineer the harness"
  - file: "A1-anatomy-detail.html"
    class: "s-anatomy-detail"
    label: "Appendix — full capability map"

paths:
  slides_dir:        "output/slides"
  styles_file:       "design/styles.css"
  script_file:       "design/script.js"
  bibliography_file: "context/bibliography.yaml"
  output_dir:        "output/slide-deck"
  output_filename:   "presentation.html"

numbering:
  enabled: true
  format: "{current} / {total}"
