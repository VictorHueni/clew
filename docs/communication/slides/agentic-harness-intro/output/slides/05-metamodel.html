<div class="slide s-metamodel">
  <div class="accent-bar-left"></div>
  <div class="section-label">The Metamodel</div>
  <h2 class="slide-title">DevOps ∞ — 8 phases · 10 skill prefixes · 19 artefact types</h2>
  <svg class="mm-ring" width="1280" height="720"></svg>
  <div class="slide-number"></div>

<script>
(function () {
  const slide = document.currentScript.closest('.s-metamodel');
  const svg   = slide.querySelector('svg.mm-ring');

  const CX = 640, CY = 408;

  const SEG = {
    rUp: [[CX,CY],[710,278],[950,278],[950,CY]],
    rDn: [[950,CY],[950,538],[710,538],[CX,CY]],
    lDn: [[CX,CY],[570,538],[330,538],[330,CY]],
    lUp: [[330,CY],[330,278],[570,278],[CX,CY]],
  };

  function bez(t,[p0,p1,p2,p3]) {
    const m=1-t;
    return [
      m*m*m*p0[0]+3*m*m*t*p1[0]+3*m*t*t*p2[0]+t*t*t*p3[0],
      m*m*m*p0[1]+3*m*m*t*p1[1]+3*m*t*t*p2[1]+t*t*t*p3[1],
    ];
  }
  function bezTan(t,[p0,p1,p2,p3]) {
    const m=1-t;
    return [
      3*(m*m*(p1[0]-p0[0])+2*m*t*(p2[0]-p1[0])+t*t*(p3[0]-p2[0])),
      3*(m*m*(p1[1]-p0[1])+2*m*t*(p2[1]-p1[1])+t*t*(p3[1]-p2[1])),
    ];
  }

  const phases = [
    { name:'Plan',    color:'#0ea5e9', seg:'lUp', t:0.5,
      cardXY:[460,205], prefixes:['discovery-','business-'],
      skills:'vision · persona · capability · value-stream · objective',
      ids:['IDEA-NNNN','P-NN','C-N.M','OBJ-NN'] },
    { name:'Code',    color:'#3b82f6', seg:'lDn', t:1.0,
      cardXY:[190,CY], prefixes:['domain-','spec-'],
      skills:'bounded-context · domain-model · fbs · use-case · prd',
      ids:['BC-NN','UC-NN','PRD-NNNN'] },
    { name:'Build',   color:'#22c55e', seg:'lDn', t:0.5,
      cardXY:[455,616], prefixes:['dev-','com-'],
      skills:'stack-guide · ralph-loop · slide-deck · artefact-viz',
      ids:['stack guides','tokens.css','slides'] },
    { name:'Test',    color:'#a855f7', seg:'lDn', t:0.1,
      cardXY:[613,510], prefixes:['spec-','arch-'],
      skills:'quality-attributes · use-case · service-contract',
      ids:['QA-XXNN','UC-NN','CTR-NN'] },
    { name:'Release', color:'#f59e0b', seg:'rUp', t:0.1,
      cardXY:[667,306], prefixes:['arch-','dev-'],
      skills:'arc42 · deployment views · git-pr workflow',
      ids:['DN-NN','SCN-NN','PR'] },
    { name:'Deploy',  color:'#f97316', seg:'rUp', t:0.5,
      cardXY:[820,205], prefixes:['ops-','dev-'],
      skills:'getting-started · runbook · infra provisioning',
      ids:['getting-started.md','runbooks'] },
    { name:'Operate', color:'#ef4444', seg:'rUp', t:1.0,
      cardXY:[1090,CY], prefixes:['ops-'],
      skills:'runbook · bug-rca · incident response',
      ids:['runbooks','RCA docs'] },
    { name:'Monitor', color:'#9aa2ae', seg:'rDn', t:0.5,
      cardXY:[825,616], prefixes:['util-'],
      skills:'metamodel-audit · docs-audit · migration',
      ids:['audit report','INDEX.md'] },
  ];

  function el(tag, a={}) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(a).forEach(([k,v]) => e.setAttribute(k,v));
    return e;
  }

  // ── Infinity path ──────────────────────────────────────────
  // Right lobe (Ops)
  svg.appendChild(el('path',{
    d:`M${CX} ${CY} C 710 278,950 278,950 ${CY} C 950 538,710 538,${CX} ${CY} Z`,
    fill:'rgba(249,115,22,0.06)', stroke:'rgba(249,115,22,0.45)',
    'stroke-width':3.5, 'stroke-linejoin':'round',
  }));
  // Left lobe (Dev)
  svg.appendChild(el('path',{
    d:`M${CX} ${CY} C 570 538,330 538,330 ${CY} C 330 278,570 278,${CX} ${CY} Z`,
    fill:'rgba(59,130,246,0.06)', stroke:'rgba(59,130,246,0.45)',
    'stroke-width':3.5, 'stroke-linejoin':'round',
  }));
  // Unified outline
  svg.appendChild(el('path',{
    d:`M${CX} ${CY} C 710 278,950 278,950 ${CY} C 950 538,710 538,${CX} ${CY} C 570 538,330 538,330 ${CY} C 330 278,570 278,${CX} ${CY} Z`,
    fill:'none', stroke:'#c8d0e4', 'stroke-width':2,
  }));

  // Lobe labels
  [{x:460,y:CY-2,t:'DEV',c:'rgba(59,130,246,0.28)'},
   {x:820,y:CY-2,t:'OPS',c:'rgba(249,115,22,0.28)'}].forEach(({x,y,t,c}) => {
    const txt = el('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle',
      'font-family':"'JetBrains Mono','Liberation Mono','Courier New',monospace",
      'font-size':28,'font-weight':800,fill:c,'letter-spacing':5});
    txt.textContent = t; svg.appendChild(txt);
  });

  // CI/CD center badge
  svg.appendChild(el('circle',{cx:CX,cy:CY,r:28,fill:'var(--surface)',stroke:'#c8d0e4','stroke-width':1.5}));
  [{t:'CI/CD',dy:-7,sz:9,c:'var(--muted)'},{t:'junction',dy:6,sz:8,c:'#9aa4bb'}].forEach(({t,dy,sz,c}) => {
    const txt=el('text',{x:CX,y:CY+dy,'text-anchor':'middle',
      'font-family':"'JetBrains Mono','Liberation Mono','Courier New',monospace",
      'font-size':sz,'font-weight':700,fill:c,'letter-spacing':0.5});
    txt.textContent=t; svg.appendChild(txt);
  });

  // Phase dots + connectors
  phases.forEach(p => {
    const [dx,dy] = bez(p.t, SEG[p.seg]);
    const [cx,cy] = p.cardXY;
    svg.appendChild(el('line',{
      x1:dx.toFixed(1),y1:dy.toFixed(1),x2:cx,y2:cy,
      stroke:p.color,'stroke-width':1.2,'stroke-dasharray':'3 4',opacity:0.45,
    }));
    svg.appendChild(el('circle',{
      cx:dx.toFixed(1),cy:dy.toFixed(1),r:5,
      fill:'var(--surface)',stroke:p.color,'stroke-width':2.5,
    }));
  });

  // Flow arrows
  [{seg:'lUp',t:0.25},{seg:'lDn',t:0.6},{seg:'rUp',t:0.6},{seg:'rDn',t:0.25}].forEach(({seg,t}) => {
    const [ax,ay]=bez(t,SEG[seg]), [tx,ty]=bezTan(t,SEG[seg]);
    const len=Math.sqrt(tx*tx+ty*ty), nx=tx/len, ny=ty/len, s=7, w=4;
    const pts=[[ax+nx*s-ny*w/2,ay+ny*s+nx*w/2],[ax-nx*s*0.3-ny*w/2,ay-ny*s*0.3+nx*w/2],[ax-ny*w*0.8,ay+nx*w*0.8]]
      .map(([px,py])=>`${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
    svg.appendChild(el('polygon',{points:pts,fill:'#9aa4bb'}));
  });

  // Phase cards
  const CARD_W=174, CARD_H=95;
  phases.forEach(p => {
    const [cx,cy] = p.cardXY;
    const card = document.createElement('div');
    card.className = 'phase-card';
    card.style.setProperty('--pc', p.color);
    card.style.left = Math.round(cx-CARD_W/2)+'px';
    card.style.top  = Math.round(cy-CARD_H/2)+'px';

    const nm = document.createElement('div'); nm.className='phase-name'; nm.textContent=p.name;
    card.appendChild(nm);

    const pw = document.createElement('div'); pw.className='phase-prefixes';
    p.prefixes.forEach(pr => {
      const b=document.createElement('span'); b.className='phase-prefix'; b.textContent=pr;
      pw.appendChild(b);
    });
    card.appendChild(pw);

    const sk=document.createElement('div'); sk.className='phase-skills'; sk.textContent=p.skills;
    card.appendChild(sk);

    const iw=document.createElement('div'); iw.className='phase-ids';
    p.ids.forEach(id => {
      const c=document.createElement('span'); c.className='id-chip'; c.textContent=id;
      iw.appendChild(c);
    });
    card.appendChild(iw);

    slide.appendChild(card);
  });
}());
</script>
</div>
